<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151519">
  <meta name="description" content="TT5an 的图形编程主页。从 DirectX 12 绘制纹理，到 Vulkan 渲染示例与 Piccolo 游戏引擎源码。">
  <title>TT5an · 图形编程</title>
  <style>
    :root { color-scheme: dark; --paper: #151519; --ink: #f4f0ea; --muted: #bdb8b7; --line: #423c40; --accent: #ffa485; }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); font: 1rem/1.65 "Inter", "Microsoft YaHei", system-ui, sans-serif; }
    .wrap { width: min(68rem, 90%); margin: auto; }
    header { border-bottom: 1px solid var(--line); }
    nav, footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    nav { padding: 1.1rem 0; }
    a { color: inherit; text-underline-offset: .3em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    a:hover { color: var(--accent); }
    .name { font-size: 1.25rem; font-weight: 750; letter-spacing: -.05em; }
    .name::before { content: ''; display: inline-block; width: .75rem; height: .75rem; margin-right: .6rem; background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .hero { display: grid; grid-template-columns: 4fr 5fr; align-items: center; gap: clamp(1rem, 5vw, 5rem); padding: clamp(3rem, 7vw, 6rem) 0; }
    h1, h2, h3, p { margin: 0; }
    h1 { font: 550 clamp(4.3rem, 11vw, 8.5rem)/1 "Inter", system-ui, sans-serif; letter-spacing: -.08em; }
    .subtitle { margin: 1rem 0 .6rem; font-size: 1.55rem; font-weight: 650; }
    .intro, .blurb, footer { color: var(--muted); }
    .art { margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: .65rem; background: radial-gradient(ellipse at 50% 65%, #32252c, #1d1b20 76%); }
    canvas { width: 100%; max-height: 23rem; display: block; object-fit: contain; }
    figcaption { padding: .65rem 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; }
    h2 { margin-bottom: 1rem; font-size: 1.4rem; }
    article { display: grid; grid-template-columns: minmax(12rem, 1fr) 2fr auto; align-items: baseline; gap: 1.5rem; padding: 1.5rem 0; border-top: 1px solid var(--line); }
    h3 { font-size: 1.25rem; }
    article a { color: var(--accent); }
    footer { margin-top: 3rem; padding: 1.2rem 0; border-top: 1px solid var(--line); font-size: .9rem; }
    @media (max-width: 44rem) {
      .hero { grid-template-columns: 1fr; gap: 1.8rem; }
      article { grid-template-columns: 1fr; gap: .4rem; }
      article a { justify-self: start; }
    }
  </style>
</head>
<body>
  <header><nav class="wrap" aria-label="主导航"><span class="name">TT5an</span><a href="https://github.com/TT5an">GitHub 主页</a></nav></header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div>
        <h1 id="title" lang="en">TT5an</h1>
        <p class="subtitle">图形编程</p>
        <p class="intro">从画出第一个矩形，到读懂游戏引擎的渲染代码。这里整理了三个可以动手尝试的入口。</p>
      </div>
      <figure class="art">
        <canvas width="960" height="560" role="img" aria-label="由暖橙色经纬线绘成的倾斜三维圆环">三维圆环的线框投影</canvas>
        <figcaption>圆环的线框投影</figcaption>
      </figure>
    </section>
    <section aria-labelledby="resources">
      <h2 id="resources">从这里开始</h2>
      <article>
        <h3>DirectX 12</h3>
        <p class="blurb">从 DrawRectangle 和 DrawTexture 两节入手，先画出一个矩形，再为它贴上纹理。</p>
        <a href="https://github.com/TT5an/DX12-Quick-Tutorial" aria-label="阅读 DirectX 12 快速教程">阅读教程</a>
      </article>
      <article>
        <h3>Vulkan</h3>
        <p class="blurb">按渲染技术查找 C++ 示例，看看延迟渲染、物理材质和计算着色器分别怎么实现。</p>
        <a href="https://github.com/TT5an/Vulkan" aria-label="浏览 Vulkan C++ 示例">浏览示例</a>
      </article>
      <article>
        <h3>Piccolo Engine</h3>
        <p class="blurb">结合 GAMES104 课程阅读小型游戏引擎的源码，把单个渲染示例放回完整引擎中理解。</p>
        <a href="https://github.com/TT5an/Piccolo" aria-label="查看 Piccolo Engine 源码">查看源码</a>
      </article>
    </section>
  </main>
  <footer class="wrap"><span>TT5an</span><a href="https://github.com/TT5an?tab=repositories">全部公开仓库</a></footer>
  <script>
    // Project the mesh once. Nearer faces cover the wireframe on the back.
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    function project(u, v) {
      const radius = 1.52 + .60 * Math.cos(v);
      const x = radius * Math.cos(u);
      const y = radius * Math.sin(u);
      const z = .60 * Math.sin(v);
      const height = y * .53 - z * .85;
      const depth = y * .85 + z * .53;
      return {
        x: 480 + 166 * (x * .94 - height * .34),
        y: 280 + 166 * (x * .34 + height * .94),
        depth
      };
    }
    function drawMesh() {
      const faces = [];
      const turn = Math.PI * 2;
      for (let i = 0; i < 48; i++) {
        for (let j = 0; j < 20; j++) {
          const u = i * turn / 48, v = j * turn / 20;
          const nextU = (i + 1) * turn / 48, nextV = (j + 1) * turn / 20;
          const points = [project(u, v), project(nextU, v), project(nextU, nextV), project(u, nextV)];
          faces.push({ points, depth: points.reduce((sum, p) => sum + p.depth, 0) / 4 });
        }
      }
      faces.sort((a, b) => a.depth - b.depth);
      for (const { points, depth } of faces) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (const p of points.slice(1)) ctx.lineTo(p.x, p.y);
        ctx.closePath();
        ctx.fillStyle = "#2d242a";
        ctx.fill();
        ctx.lineWidth = 1.35;
        ctx.strokeStyle = `hsl(${18 + depth * 5}, 88%, ${57 + depth * 11}%)`;
        ctx.stroke();
      }
    }
    if (ctx) drawMesh();
  </script>
</body>
</html>
