<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c25">
  <meta name="description" content="TT5an 的实时着色器作品：雨中磨砂玻璃、焰影回旋、深海水母。">
  <title>雨中磨砂玻璃 · TT5an</title>
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery.js" defer></script>
</head>
<body data-scene="rain">
  <div class="page">
    <header>
      <a class="signature" href="#rain" aria-label="TT5an 首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>TT5an</a>
      <a class="profile" href="https://github.com/TT5an" aria-label="TT5an 的 GitHub 个人资料">GitHub</a>
    </header>
    <main>
      <section class="theater" aria-labelledby="scene-title">
        <h1 id="scene-title">雨中磨砂玻璃</h1>
        <div class="stage">
          <img id="poster" src="renders/rain.webp" alt="夜色中的灯光透过挂满雨滴的磨砂玻璃" width="960" height="480">
          <canvas id="screen" hidden aria-hidden="true"></canvas>
        </div>
        <div class="transport" hidden>
          <button id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span id="play-label">暂停</span></button>
          <div class="parameter">
            <label id="parameter-label" for="parameter">磨砂强度</label>
            <input id="parameter" type="range" min="0" max="100" value="62">
            <output id="value" for="parameter" aria-hidden="true">62%</output>
          </div>
        </div>
        <p class="notice" role="status" hidden>当前显示静态预览。</p>
        <noscript><p>开启 JavaScript 可播放和调节作品。</p></noscript>
      </section>
      <nav class="reel" aria-label="选择作品">
        <a class="tile" href="#rain" aria-current="true"><img src="renders/rain.webp" alt="" width="96" height="60"><span>雨中磨砂玻璃</span></a>
        <a class="tile" href="#fire"><img src="renders/fire.webp" alt="" width="96" height="60"><span>焰影回旋</span></a>
        <a class="tile" href="#jelly"><img src="renders/jelly.webp" alt="" width="96" height="60"><span>深海水母</span></a>
      </nav>
    </main>
  </div>
</body>
</html>
